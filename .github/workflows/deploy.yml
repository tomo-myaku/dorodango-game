name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build -- --base=/dorodango-game/
      # Keep v0.1 at the root. A separately built v0.2 prototype lives at
      # /preview/ for side-by-side play-testing, without merging the source.
      - name: Checkout v0.2 preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.2-clay-color-and-feedback
          path: preview-src
      - name: Install preview dependencies
        working-directory: preview-src
        run: npm install
      - name: Typecheck and build v0.2 preview
        working-directory: preview-src
        run: npm run build -- --base=/dorodango-game/preview/
      - name: Add the preview to the site
        run: |
          mkdir -p dist/preview
          cp -a preview-src/dist/. dist/preview/
      # Republish the latest playground branch while preserving the artisan versions.
      - name: Checkout rainy-day playground
        uses: actions/checkout@v4
        with:
          ref: feature/playground-rainy-earth
          path: playground-src
      - name: Add rainy-day playground to site
        run: |
          mkdir -p dist/playground
          cp playground-src/public/playground/index.html dist/playground/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
